<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed, opaque variant for Google Search, favicon.ico and apple-touch-icon.
       Those crop or round the icon themselves, so it must not have transparent corners. -->
  <defs>
    <!-- Dot pattern -->
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.4" fill="#ffffff" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Screen -->
  <rect width="512" height="512" fill="#001a00"/>
  <!-- Dot grid -->
  <rect width="512" height="512" fill="url(#dots)"/>
  <!-- Letter c, centered and sized to sit inside a circular crop -->
  <path transform="translate(99.2 399) scale(0.52 -0.52)" fill="#00FF66" stroke="#00FF66" opacity="0.9" stroke-width="20" stroke-linejoin="round" d="M304 -10Q238 -10 188.5 15.0Q139 40 112.0 87.5Q85 135 85 200V350Q85 416 112.0 463.0Q139 510 188.5 535.0Q238 560 304 560Q399 560 457.0 509.0Q515 458 518 370H428Q425 423 392.5 451.5Q360 480 304 480Q245 480 210.0 446.5Q175 413 175 351V200Q175 138 210.0 104.0Q245 70 304 70Q360 70 392.5 99.0Q425 128 428 180H518Q515 92 457.0 41.0Q399 -10 304 -10Z"/>

</svg>
